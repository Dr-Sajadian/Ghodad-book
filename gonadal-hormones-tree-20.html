<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقشهٔ درختی فارماکولوژی غدد گنادی – دکتر مهدی مشهدی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --font: 'Vazirmatn', Tahoma, sans-serif;
  }
  /* ===== Theme: night ===== */
  html[data-theme="night"]{
    --bg: #0f1420;
    --bg2: #161d2e;
    --panel: #1a2236;
    --panel2: #212b42;
    --text: #e7ecf7;
    --muted: #9aa7c2;
    --accent: #35c2c1;
    --accent2: #6a8dff;
    --border: #2a3450;
    --shadow: rgba(0,0,0,.45);
    --pill: #2a3450;
  }
  /* ===== Theme: emerald ===== */
  html[data-theme="emerald"]{
    --bg: #f0f7f2;
    --bg2: #e3f1e8;
    --panel: #ffffff;
    --panel2: #eaf6ee;
    --text: #10321f;
    --muted: #4b7a5e;
    --accent: #0f9d58;
    --accent2: #0b6e42;
    --border: #cfe9d8;
    --shadow: rgba(15,80,50,.12);
    --pill: #dff2e6;
  }
  /* ===== Theme: sunset ===== */
  html[data-theme="sunset"]{
    --bg: #241521;
    --bg2: #341c2c;
    --panel: #3a1f30;
    --panel2: #45253a;
    --text: #fbe9ef;
    --muted: #d9a9bf;
    --accent: #ff8a5b;
    --accent2: #ff5d8f;
    --border: #55304a;
    --shadow: rgba(0,0,0,.4);
    --pill: #4a2a3f;
  }
  /* ===== Theme: ice ===== */
  html[data-theme="ice"]{
    --bg: #eef4fb;
    --bg2: #e2edf9;
    --panel: #ffffff;
    --panel2: #eaf2fc;
    --text: #10233b;
    --muted: #4d6b8f;
    --accent: #1f8fd6;
    --accent2: #2fb3c7;
    --border: #d3e4f5;
    --shadow: rgba(20,60,110,.12);
    --pill: #dfeefb;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: var(--font);
    background: linear-gradient(180deg, var(--bg), var(--bg2));
    color: var(--text);
    min-height:100vh;
    transition: background .35s ease, color .35s ease;
    line-height:1.9;
  }

  .app-header{
    position:sticky; top:0; z-index:50;
    background: var(--panel);
    border-bottom:1px solid var(--border);
    box-shadow:0 4px 18px var(--shadow);
  }
  .header-inner{
    max-width:1100px; margin:0 auto; padding:18px 20px 14px;
    display:flex; flex-wrap:wrap; align-items:center; gap:16px; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .icon{
    width:52px;height:52px; border-radius:16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-size:26px; box-shadow:0 6px 16px var(--shadow); flex:none;
  }
  .brand h1{margin:0; font-size:20px; font-weight:800;}
  .brand p{margin:2px 0 0; font-size:13px; color:var(--muted); font-weight:500;}

  .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .btn{
    font-family:var(--font);
    border:1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    padding:9px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    display:flex; align-items:center; gap:6px;
  }
  .btn:hover{ border-color: var(--accent); color: var(--accent); transform:translateY(-1px);}
  .btn.primary{ background: linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; border:none;}
  .btn.primary:hover{ color:#fff; filter:brightness(1.08);}
  .themes{display:flex; gap:6px; align-items:center; border-inline-start:1px solid var(--border); padding-inline-start:10px; margin-inline-start:4px;}
  .theme-dot{
    width:26px;height:26px;border-radius:50%; cursor:pointer; border:2px solid transparent;
    position:relative;
  }
  .theme-dot.active{border-color: var(--text);}
  .theme-dot[data-t="night"]{background:linear-gradient(135deg,#35c2c1,#0f1420);}
  .theme-dot[data-t="emerald"]{background:linear-gradient(135deg,#0f9d58,#e3f1e8);}
  .theme-dot[data-t="sunset"]{background:linear-gradient(135deg,#ff8a5b,#3a1f30);}
  .theme-dot[data-t="ice"]{background:linear-gradient(135deg,#1f8fd6,#eef4fb);}

  .searchwrap{position:relative;}
  #searchbox{
    font-family:var(--font);
    border:1px solid var(--border);
    background: var(--panel2);
    color:var(--text);
    padding:9px 14px;
    border-radius:10px;
    font-size:13px;
    width:200px;
  }

  main{max-width:1100px; margin:0 auto; padding:26px 20px 80px;}

  .stats{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; font-size:12.5px; color:var(--muted);
  }
  .stats span{background:var(--pill); padding:5px 12px; border-radius:999px;}

  ul.tree, ul.tree ul{ list-style:none; margin:0; padding-inline-start:26px; }
  ul.tree{ padding-inline-start:0; }
  ul.tree ul{
    border-inline-start:2px dashed var(--border);
    margin-inline-start:12px;
    padding-inline-start:22px;
  }
  li.node-li{ margin:6px 0; position:relative; }

  .node{
    display:flex; align-items:flex-start; gap:8px;
    cursor:pointer;
    padding:8px 12px;
    border-radius:12px;
    background: var(--panel);
    border:1px solid var(--border);
    box-shadow: 0 2px 6px var(--shadow);
    transition:.15s;
  }
  .node:hover{ border-color: var(--accent); }
  li.node-li.root-item > .node{
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color:#fff; font-size:17px; font-weight:800; border:none;
  }
  li.node-li.root-item > .node .toggle{color:#fff;}
  li.node-li.section > .node{ font-weight:700; font-size:15px; background:var(--panel2); }

  .toggle{
    flex:none; width:20px; height:20px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--accent); transition:transform .2s; margin-top:2px; user-select:none;
  }
  li.node-li.collapsed > .node .toggle{ transform: rotate(-90deg); }
  li.node-li.leaf > .node .toggle{ visibility:hidden; }

  .title{ font-weight:600; font-size:14.5px; flex:1; }
  .badge{
    font-size:10.5px; color:var(--muted); background:var(--pill); border-radius:6px; padding:1px 7px; margin-inline-start:6px; font-weight:600;
  }

  .desc{
    margin: 6px 0 6px 0;
    padding: 10px 14px;
    background: var(--panel2);
    border-inline-start: 3px solid var(--accent);
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--text);
    white-space: pre-line;
    line-height: 2;
  }

  .img-wrap{ margin:8px 0; text-align:center; }
  .img-wrap img{
    max-width:100%; border-radius:10px; border:1px solid var(--border);
    box-shadow:0 4px 14px var(--shadow); cursor:zoom-in;
    max-height:340px; object-fit:contain; background:#fff;
  }
  .img-cap{font-size:11.5px; color:var(--muted); margin-top:4px;}

  li.node-li.collapsed > ul,
  li.node-li.collapsed > .desc,
  li.node-li.collapsed > .img-wrap{ display:none; }

  .hidden-by-search{ display:none !important; }

  /* Lightbox */
  #lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.85); display:none;
    align-items:center; justify-content:center; z-index:999; cursor:zoom-out;
  }
  #lightbox img{max-width:92%; max-height:92%; border-radius:8px;}

  footer{ text-align:center; padding:30px 10px 50px; color:var(--muted); font-size:12px;}

  @media (max-width: 640px){
    .header-inner{flex-direction:column; align-items:stretch;}
    .toolbar{justify-content:center;}
    #searchbox{width:140px;}
  }

  /* ===== Print ===== */
  @media print{
    .app-header, #lightbox, .stats{ display:none !important; }
    body{ background:#fff; color:#000; }
    ul.tree li.node-li.collapsed > ul,
    ul.tree li.node-li.collapsed > .desc,
    ul.tree li.node-li.collapsed > .img-wrap{ display:block !important; }
    .node{ box-shadow:none; border:1px solid #ccc; background:#fff !important; color:#000 !important; }
    li.node-li.root-item > .node, li.node-li.section > .node{ background:#eee !important; color:#000 !important; }
    .desc{ background:#f7f7f7; color:#000; border-color:#888; }
    .toggle{ display:none; }
    ul.tree ul{ border-inline-start:1px solid #ccc; }
    .img-wrap img{ max-height:260px; }
    main{ padding:0; max-width:100%; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="icon">💊</div>
      <div>
        <h1>نقشهٔ درختی فارماکولوژی غدد گنادی</h1>
        <p>هورمون‌های گنادی: آگونیست و آنتاگونیست — دکتر مهدی مشهدی (Pharm D, PhD)</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="searchwrap"><input id="searchbox" type="text" placeholder="جستجو در مطالب..."></div>
      <button class="btn" id="btnOpenAll">باز کردن همه</button>
      <button class="btn" id="btnCloseAll">بستن همه</button>
      <button class="btn primary" id="btnPrint">🖨 ذخیره PDF</button>
      <div class="themes">
        <div class="theme-dot" data-t="night" title="Night"></div>
        <div class="theme-dot" data-t="emerald" title="Emerald"></div>
        <div class="theme-dot" data-t="sunset" title="Sunset"></div>
        <div class="theme-dot" data-t="ice" title="Ice"></div>
      </div>
    </div>
  </div>
</div>

<main>
  <div class="stats" id="stats"></div>
  <ul class="tree" id="treeRoot"></ul>
</main>

<footer>نقشهٔ درختی جزوهٔ «Gonadal Hormones: Agonist &amp; Antagonist» — تمام مطالب اسالیدها بدون کم‌وکاست در این ساختار گنجانده شده است.</footer>

    {"t":"اثرات فیزیولوژیک آنالوگ‌های استروژن بر ارگان‌های بدن","img":"estrogenEffectsBody","imgCap":"اثرات استروژن بر مغز، پستان، قلب و کبد، تخمدان، رحم، واژن و استخوان","d":"Brain: کمک به حفظ دمای بدن، احتمال تأخیر در افت حافظه، تنظیم بخش‌هایی از مغز که بدن را برای تکامل جنسی و باروری آماده می‌کند.\nBreast: تحریک رشد پستان در بلوغ و آماده‌سازی غدد برای تولید شیر در آینده.\nHeart & Liver: کمک به تنظیم تولید کلسترول کبدی، کاهش تجمع پلاک در عروق کرونر.\nOvary: تحریک بلوغ تخمدان‌ها؛ شروع سیکل قاعدگی (نشانهٔ بلوغ سیستم تولیدمثل).\nUterus: تحریک بلوغ رحم؛ آماده‌سازی رحم برای تغذیهٔ جنین در حال رشد.\nVagina: تحریک بلوغ واژن؛ کمک به حفظ پوشش لغزنده و ضخیم واژن.\nBone: کمک به حفظ تراکم استخوان."}

    {"t":"اثرات پروژسترون‌های 21 کربنه","d":"• حفظ و حمایت بارداری\n• تحریک‌کنندهٔ مرکز تنفس‌اند: ■ آلکالوز تنفسی ■ جلوگیری‌کننده از آپنه\n• افزایش دمای بدن\n• تکامل Breast Alveolobular ↑ ← ترشح شیر\n• افزایش قطر موکوس و ترشحات سرویکس ← ↑ ریسک عفونت‌های واژینال\n• اثرات Depressant و Hypnotic\n• اثرات آنتاگونیزه‌کنندهٔ آلدوسترون در احتباس آب و نمک\n• یبوست ← کاهش حرکات روده؛ رفلاکس معده به مری ← شل شدن کاردیا\n• افزایش اشتها ← مجسترول (کاربرد درمانی در بی‌اشتهایی ناشی از کموتراپی)\n• اثرات آندروژنیک"},
    {"t":"پروژستین‌های 19 کربنه: خصلت‌ها","d":"مهم‌ترین خصلت آنها فیدبک منفی روی هیپوتالاموس است: GnRH ← مهم‌ترین علت کاربرد آنها در درمان اندومتریوز و کاربرد به‌عنوان OCP\nاثرات آندروژنیک: از نسل اول تا چهارم این اثر کم و کمتر می‌شود.\nترشحات سرویکس را تغییر می‌دهند: مخاط دهانهٔ رحم را غلیظ کرده و پوشش رحم را نازک می‌کنند ← مشکل شدن حرکت اسپرم\nدیگر اثرات 21 کربنه‌ها را تقریباً ندارند!"},
    {"t":"کاربردهای درمانی Progesterone و Progestins","d":"✓ HRT به همراه استروژن‌ها (قبلاً اشاره شد) ← فقط 21 کربنه‌ها\n✓ Hormonal contraception همراه با استروژن‌ها (قبلاً اشاره شد) ← عمدتاً 19 کربنه‌ها\n✓ دیسمنوره، اندومتریوز، لکه‌بینی (Spotting)، سندروم پیش‌ازقاعدگی (PMS)\n✓ To delay premature labor ← جلوگیری از سقط عادتی"}

  {"t":"کنترل ترشح تخمدانی و اثرات هورمون‌های آن (شمای جامع)","d":"Hypothalamus →(GnRH antagonists مهار می‌کنند / GnRH agonists +/- اثر دارند)→ GnRH → Anterior pituitary →(Clomiphene تحریک می‌کند(+) / Oral contraceptives و danazol مهار می‌کنند(-))→ FSH, LH → Ovary → Progesterone (Luteal phase) و مسیر P450c17 →(Ketoconazole, danazol مهار می‌کنند)→ Testosterone → Androstenedione →(Aromatase)→(Anastrozole و دیگران مهار می‌کنند)→ Estradiol ⇌ Estrone → Estriol\nEstradiol →(Fulvestrant مهار می‌کند / SERMs +/- اثر دارند)→ Estrogen response element → Expression in estrogen-responsive cells"},

  ]},
  {"t":"سه مرحلهٔ اساسی روش‌های القای تخمک‌گذاری","d":"تمامی روش‌های القای تخمک‌گذاری 3 مرحلهٔ اساسی دارند:\n۱. ابتدا گنادوتروپین اندوژن با به‌کارگیری یک آگونیست طولانی‌اثر (که درواقع آنتاگونیست محسوب می‌شود) یا یک آنتاگونیست واقعی مهار می‌شود.\n۲. سپس تکامل فولیکول با تزریق روزانهٔ فراوردهٔ واجد فعالیت FSH (مونوتروپین یا آنالوگ FSH) انجام می‌شود.\n۳. در نهایت بلوغ اووسیت با تزریق LH القا می‌شود.\nنکته: نقش کلومیفن در این پروتکل نیز قابل بررسی است (به‌عنوان محرک ترشح گنادوتروپین اندوژن)."},
  {"t":"Ovarian hyper-stimulation syndrome (OHSS)","c":[

    {"t":"علائم","d":"تخمدان‌ها متورم و دردناک می‌شوند. تعداد کمی از افراد ممکن است دچار OHSS شدید شوند که می‌تواند باعث افزایش سریع وزن، درد شکم، استفراغ و تنگی نفس شود."},

  {"t":"آگونیست‌های GnRH","c":[

/* ================== RENDER ================== */
function renderNode(node, isRoot, isTopSection){
  const li = document.createElement('li');
  li.className = 'node-li' + (isRoot ? ' root-item' : '') + (isTopSection ? ' section' : '');
  const hasChildren = node.c && node.c.length;
  const hasDesc = !!node.d;
  const hasImg = !!node.img;
  if(!hasChildren && !hasDesc && !hasImg) li.classList.add('leaf');
  if(!isRoot) li.classList.add('collapsed');

  const div = document.createElement('div');
  div.className = 'node';
  const toggle = document.createElement('span');
  toggle.className = 'toggle';
  toggle.textContent = '▾';
  const title = document.createElement('span');
  title.className = 'title';
  title.textContent = node.t;
  div.appendChild(toggle);
  div.appendChild(title);
  li.appendChild(div);

  div.addEventListener('click', function(e){
    li.classList.toggle('collapsed');
  });

  if(hasDesc){
    const d = document.createElement('div');
    d.className = 'desc';
    d.textContent = node.d;
    li.appendChild(d);
  }
  if(hasImg){
    const wrap = document.createElement('div');
    wrap.className = 'img-wrap';
    const img = document.createElement('img');
    img.src = IMAGES[node.img];
    img.alt = node.imgCap || node.t;
    img.addEventListener('click', function(ev){
      ev.stopPropagation();
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightbox').style.display = 'flex';
    });
    wrap.appendChild(img);
    if(node.imgCap){
      const cap = document.createElement('div');
      cap.className = 'img-cap';
      cap.textContent = node.imgCap;
      wrap.appendChild(cap);
    }
    li.appendChild(wrap);
  }
  if(hasChildren){
    const ul = document.createElement('ul');
    node.c.forEach(child => ul.appendChild(renderNode(child, false, isRoot)));
    li.appendChild(ul);
  }
  return li;
}

function countNodes(node){
  let n = 1;
  if(node.c) node.c.forEach(c => n += countNodes(c));
  return n;
}

const root = document.getElementById('treeRoot');
root.appendChild(renderNode(DATA, true, false));
document.querySelector('li.root-item').classList.remove('collapsed');

document.getElementById('stats').innerHTML =
  '<span>🌳 مجموع گره‌ها: ' + countNodes(DATA) + '</span>' +
  '<span>📚 بخش اصلی: ' + DATA.c.length + '</span>' +
  '<span>🖼 تصاویر: ' + Object.keys(IMAGES).length + '</span>';

/* ================== CONTROLS ================== */
document.getElementById('btnOpenAll').addEventListener('click', function(){
  document.querySelectorAll('#treeRoot li.node-li').forEach(li => li.classList.remove('collapsed'));
});
document.getElementById('btnCloseAll').addEventListener('click', function(){
  document.querySelectorAll('#treeRoot li.node-li').forEach(li => li.classList.add('collapsed'));
  document.querySelector('li.root-item').classList.remove('collapsed');
});
document.getElementById('btnPrint').addEventListener('click', function(){
  document.querySelectorAll('#treeRoot li.node-li').forEach(li => li.classList.remove('collapsed'));
  setTimeout(() => window.print(), 150);
});

document.getElementById('lightbox').addEventListener('click', function(){
  this.style.display = 'none';
});

/* Theme handling */
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.t === t));
  try{ localStorage.setItem('gonadTreeTheme', t); }catch(e){}
}
document.querySelectorAll('.theme-dot').forEach(dot=>{
  dot.addEventListener('click', () => setTheme(dot.dataset.t));
});
let savedTheme = 'emerald';
try{ savedTheme = localStorage.getItem('gonadTreeTheme') || 'emerald'; }catch(e){}
setTheme(savedTheme);

/* Search / filter */
const searchbox = document.getElementById('searchbox');
searchbox.addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  const allLis = document.querySelectorAll('#treeRoot li.node-li');
  if(!q){
    allLis.forEach(li => li.classList.remove('hidden-by-search'));
    return;
  }
  allLis.forEach(li => li.classList.add('hidden-by-search'));
  allLis.forEach(li => {
    const titleEl = li.querySelector(':scope > .node > .title');
    const descEl = li.querySelector(':scope > .desc');
    const text = (titleEl ? titleEl.textContent : '') + ' ' + (descEl ? descEl.textContent : '');
    if(text.toLowerCase().includes(q)){
      li.classList.remove('hidden-by-search');
      li.classList.remove('collapsed');
      let p = li.parentElement;
      while(p && p.id !== 'treeRoot'){
        const parentLi = p.closest('li.node-li');
        if(parentLi){
          parentLi.classList.remove('hidden-by-search');
          parentLi.classList.remove('collapsed');
          p = parentLi.parentElement;
        } else break;
      }
    }
  });
});
